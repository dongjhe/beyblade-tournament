<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>戰鬥陀螺比賽系統</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07111f;color:#eef6ff}.wrap{max-width:1050px;margin:auto;padding:20px}.hero{padding:28px 0 12px}.hero h1{margin:0;font-size:30px}.hero p{color:#91a7bd}.card{background:#101d2d;border:1px solid #26384d;border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.players{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{display:block;font-size:13px;color:#a9bbcc;margin-bottom:6px}input,select,button{font:inherit}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #385069;background:#091523;color:white;font-size:16px}button{border:0;border-radius:11px;padding:12px 16px;font-weight:700;cursor:pointer;background:#1e8cff;color:white}.secondary{background:#26394e}.danger{background:#a83a45}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.hidden{display:none}.match{display:grid;grid-template-columns:1fr 64px 22px 64px 1fr;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid #25374a}.match .p2{text-align:right}.score{text-align:center;font-weight:800}.round{color:#65b5ff;font-weight:800;margin-top:20px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 6px;border-bottom:1px solid #26384d;text-align:center}.table th:nth-child(2),.table td:nth-child(2){text-align:left}.rank1{color:#ffd55c;font-weight:800}.muted{color:#91a7bd;font-size:13px}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#20364e;color:#9bd0ff;font-size:12px}.champ{padding:20px;text-align:center;font-size:22px;font-weight:800;color:#ffd55c}.bye{color:#91a7bd;text-align:center}.tabs{display:flex;gap:8px}.tabs button.active{background:#1e8cff}.tabs button{background:#26394e;flex:1}.error{color:#ff9ca5;margin-top:8px}@media(max-width:650px){.grid,.players{grid-template-columns:1fr}.match{grid-template-columns:1fr 50px 16px 50px 1fr}.wrap{padding:14px}.hero h1{font-size:25px}}
</style>
</head><body><main class="wrap">
<section class="hero"><span class="badge">BEYBLADE X</span><h1>⚡ 戰鬥陀螺比賽系統</h1><p>建立選手名單、自動產生對戰、輸入比分並即時計算排名或晉級。</p></section>
<section id="setup" class="card">
<div class="grid"><div><label>比賽名稱</label><input id="title" value="戰鬥陀螺挑戰賽"></div><div><label>參賽人數</label><input id="count" type="number" min="2" max="64" value="5"></div></div>
<div style="margin-top:16px"><label>比賽模式</label><div class="tabs"><button type="button" id="leagueBtn" class="active">🏆 積分賽</button><button type="button" id="knockBtn">⚔️ 晉級賽</button></div></div>
<h3>參賽選手</h3><div id="playerInputs" class="players"></div><div id="error" class="error"></div>
<div class="actions"><button id="start">產生對戰組合</button><button id="demo" class="secondary">填入測試選手</button></div></section>
<section id="game" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h2 id="gameTitle" style="margin:0"></h2><span id="modeBadge" class="badge"></span></div><div class="actions" style="margin:0"><button id="reset" class="secondary">重新建立</button><button id="clear" class="danger">清除紀錄</button></div></div></div><div id="standings" class="card"></div><div id="matches" class="card"></div></section>
</main><script>
(()=>{const $=s=>document.querySelector(s);let mode='league',players=[],matches=[];const key='beybladeTournamentV1';
function playerFields(){let n=Math.max(2,Math.min(64,+$('#count').value||2));$('#count').value=n;let old=[...document.querySelectorAll('.pn')].map(x=>x.value);$('#playerInputs').innerHTML='';for(let i=0;i<n;i++){let d=document.createElement('div');d.innerHTML=`<label>選手 ${i+1}</label><input class="pn" placeholder="輸入選手名稱" value="${esc(old[i]||'')}">`;$('#playerInputs').appendChild(d)}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setMode(m){mode=m;$('#leagueBtn').classList.toggle('active',m==='league');$('#knockBtn').classList.toggle('active',m==='knockout')}
function start(){players=[...document.querySelectorAll('.pn')].map(x=>x.value.trim());if(players.some(x=>!x)){ $('#error').textContent='請輸入所有選手名稱';return}if(new Set(players).size!==players.length){$('#error').textContent='選手名稱不可重複';return}$('#error').textContent='';matches=[];if(mode==='league')makeLeague();else makeKnockout();show();save()}
function makeLeague(){let id=0;for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++)matches.push({id:id++,a:players[i],b:players[j],sa:'',sb:'',round:1})}
function makeKnockout(){let size=1;while(size<players.length)size*=2;let seeded=[...players];while(seeded.length<size)seeded.push(null);for(let i=0;i<size/2;i++)matches.push({id:i,a:seeded[i],b:seeded[size-1-i],sa:'',sb:'',round:1});advanceByes()}
function advanceByes(){let changed=true;while(changed){changed=false;let rounds=Math.log2(nextPow2(players.length));for(let r=1;r<rounds;r++){let prev=matches.filter(m=>m.round===r);if(prev.length && prev.every(m=>winner(m)!==undefined)){let next=matches.filter(m=>m.round===r+1);if(!next.length){for(let i=0;i<prev.length;i+=2)matches.push({id:matches.length,a:winner(prev[i]),b:winner(prev[i+1]),sa:'',sb:'',round:r+1});changed=true}}}}render()}
function nextPow2(n){let x=1;while(x<n)x*=2;return x}function winner(m){if(!m.a)return m.b;if(!m.b)return m.a;if(m.sa===''||m.sb==='')return undefined;let a=+m.sa,b=+m.sb;if(a===b)return undefined;return a>b?m.a:m.b}
function score(id,side,v){let m=matches.find(x=>x.id===id);m[side]=v===''?'':Math.max(0,+v);if(mode==='knockout'){let r=m.round;matches=matches.filter(x=>x.round<=r);advanceByes()}render();save()}
function render(){if(mode==='league'){renderStandings();$('#matches').innerHTML='<h3>對戰組合</h3>'+matches.map((m,i)=>matchHTML(m,i+1)).join('')}else{renderKnockout()}}
function matchHTML(m,no){if(!m.a||!m.b)return `<div class="match"><span>${esc(m.a||'輪空')}</span><span></span><span>—</span><span></span><span class="p2">${esc(m.b||'輪空')}</span></div>`;return `<div class="match"><span>${esc(m.a)}</span><input class="score" type="number" min="0" value="${m.sa}" data-id="${m.id}" data-side="sa"><span>:</span><input class="score" type="number" min="0" value="${m.sb}" data-id="${m.id}" data-side="sb"><span class="p2">${esc(m.b)}</span></div>`}
function renderStandings(){let s=players.map(p=>({p,w:0,l:0,pf:0,pa:0,pts:0}));for(let m of matches){if(m.sa===''||m.sb==='')continue;let a=s.find(x=>x.p===m.a),b=s.find(x=>x.p===m.b),sa=+m.sa,sb=+m.sb;a.pf+=sa;a.pa+=sb;b.pf+=sb;b.pa+=sa;if(sa>sb){a.w++;b.l++;a.pts+=3}else if(sb>sa){b.w++;a.l++;b.pts+=3}else{a.pts++;b.pts++}}s.sort((a,b)=>b.pts-a.pts||b.w-a.w||(b.pf-b.pa)-(a.pf-a.pa)||b.pf-a.pf);$('#standings').innerHTML='<h3>即時排名</h3><div style="overflow:auto"><table class="table"><thead><tr><th>#</th><th>選手</th><th>勝</th><th>敗</th><th>得分</th><th>失分</th><th>分差</th><th>積分</th></tr></thead><tbody>'+s.map((x,i)=>`<tr class="${i===0?'rank1':''}"><td>${i+1}</td><td>${esc(x.p)}</td><td>${x.w}</td><td>${x.l}</td><td>${x.pf}</td><td>${x.pa}</td><td>${x.pf-x.pa}</td><td><b>${x.pts}</b></td></tr>`).join('')+'</tbody></table></div><p class="muted">勝 3 分、和局 1 分；同積分依勝場、分差、總得分排序。</p>'}
function renderKnockout(){let rounds=Math.log2(nextPow2(players.length)),html='<h3>淘汰賽對戰</h3>';for(let r=1;r<=rounds;r++){let ms=matches.filter(m=>m.round===r);if(!ms.length)continue;html+=`<div class="round">${r===rounds?'🏆 冠軍戰':`第 ${r} 輪`}</div>`+ms.map((m,i)=>matchHTML(m,i+1)).join('')}let final=matches.filter(m=>m.round===rounds)[0],champ=final&&winner(final);if(champ)html+=`<div class="champ">🏆 冠軍：${esc(champ)}</div>`;$('#standings').innerHTML='<h3>賽制</h3><p>單敗淘汰，比分較高者自動晉級；人數不足完整籤位時自動輪空。</p>';$('#matches').innerHTML=html}
function show(){$('#setup').classList.add('hidden');$('#game').classList.remove('hidden');$('#gameTitle').textContent=$('#title').value||'戰鬥陀螺比賽';$('#modeBadge').textContent=mode==='league'?'積分賽':'晉級賽';render()}
function save(){localStorage.setItem(key,JSON.stringify({title:$('#title').value,mode,players,matches}))}function load(){try{let d=JSON.parse(localStorage.getItem(key));if(!d||!d.players?.length)return;mode=d.mode;players=d.players;matches=d.matches;$('#title').value=d.title||'';$('#count').value=players.length;setMode(mode);playerFields();[...document.querySelectorAll('.pn')].forEach((x,i)=>x.value=players[i]);show()}catch(e){}}
$('#count').addEventListener('change',playerFields);$('#leagueBtn').onclick=()=>setMode('league');$('#knockBtn').onclick=()=>setMode('knockout');$('#start').onclick=start;$('#demo').onclick=()=>{[...document.querySelectorAll('.pn')].forEach((x,i)=>x.value=['小明','小華','阿哲','小宇','小凱','小杰','小安','小翔'][i]||`選手${i+1}`)};$('#matches').addEventListener('change',e=>{if(e.target.matches('.score'))score(+e.target.dataset.id,e.target.dataset.side,e.target.value)});$('#reset').onclick=()=>{$('#game').classList.add('hidden');$('#setup').classList.remove('hidden')};$('#clear').onclick=()=>{if(confirm('確定清除目前比賽紀錄？')){localStorage.removeItem(key);location.reload()}};playerFields();load();})();
</script></body></html>
